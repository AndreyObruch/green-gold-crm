<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Gold CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="login-form" class="login-card" style="display: none;">
            <h2>Green Gold CRM</h2>
            <p class="small-note">Вход в систему</p>
            <div class="field">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="Логин" autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
            </div>
            <button class="btn btn-primary btn-block" onclick="login()">Войти</button>
        </div>

        <div id="dashboard" style="display: none;">
            <header class="topbar">
                <h1 class="brand">Green Gold CRM</h1>
                <nav class="main-nav">
                    <button class="nav-btn active" data-tab="tasks">Задачи</button>
                    <button class="nav-btn" data-tab="create" id="nav-create">Создать задачу</button>
                    <button class="nav-btn" data-tab="archive" id="nav-archive">Архив</button>
                </nav>
                <button class="btn btn-ghost" onclick="logout()">Выйти</button>
            </header>

            <div id="tab-tasks" class="tab-panel">
                <h3 class="section-title">Задачи</h3>
                <div id="counters" class="saved-views"></div>
                <div class="toolbar">
                    <input type="search" id="search-input" class="search-input" placeholder="Поиск: название, описание, исполнитель" aria-label="Поиск задач">
                    <select id="filter-status" aria-label="Фильтр по статусу">
                        <option value="all">Все статусы</option>
                        <option value="new">Новые</option>
                        <option value="in_progress">В работе</option>
                        <option value="done">Готово</option>
                    </select>
                    <select id="sort-by" aria-label="Сортировка">
                        <option value="date_desc">Сначала новые</option>
                        <option value="date_asc">Сначала старые</option>
                        <option value="title">По названию</option>
                        <option value="status">По статусу</option>
                    </select>
                </div>
                <div class="saved-views">
                    <button class="view-chip active" data-view="all">Все</button>
                    <button class="view-chip" data-view="mine">Мои</button>
                    <button class="view-chip" data-view="active">Активные</button>
                </div>
                <ul id="task-list"></ul>
            </div>

            <div id="admin-panel" class="tab-panel" style="display: none;">
                <h3 class="panel-title">Создать задачу</h3>
                <div class="form-row">
                    <div class="field">
                        <label for="task-title">Название</label>
                        <input type="text" id="task-title" placeholder="Название">
                    </div>
                    <div class="field">
                        <label for="task-desc">Описание</label>
                        <textarea id="task-desc" placeholder="Описание"></textarea>
                    </div>
                </div>
                <div class="field">
                    <label for="task-assignee">Исполнитель</label>
                    <select id="task-assignee"></select>
                </div>
                <div class="field">
                    <label for="task-files">Вложения (до 3 файлов, каждый ≤ 10 МБ)</label>
                    <input type="file" id="task-files" multiple accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.csv,.txt">
                </div>
                <button class="btn btn-gold" onclick="createTask()">Создать</button>
            </div>

            <div id="archive-panel" class="tab-panel" style="display: none;">
                <h3 class="panel-title">Архив (удалённые)</h3>
                <ul id="archive-list"></ul>
            </div>
        </div>
    </div>

    <div id="bulk-bar" class="bulk-bar" style="display: none;">
        <span id="bulk-count" class="small-note" style="margin:0">Выбрано: 0</span>
        <button id="bulk-delete" class="btn btn-danger">Удалить выбранные</button>
        <button id="bulk-clear" class="btn btn-ghost">Снять выбор</button>
    </div>

    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="drawer" class="drawer" aria-label="Детали задачи">
        <button id="drawer-close" class="btn btn-ghost" style="margin-bottom:12px">Закрыть</button>
        <div id="drawer-body"></div>
    </aside>

    <div id="toast" class="toast" role="status">
        <span id="toast-msg"></span>
        <button id="toast-undo" class="toast-undo" style="display:none">Отменить</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
